services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend/db:/app/db
    depends_on:
      - mysql
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  mysql:
    image: mysql:8.4
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  dbgate:
    image: dbgate/dbgate:latest
    container_name: ${DBGATE_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "${DBGATE_PORT}:3000"
    volumes:
      - dbgate_data:/root/.dbgate

volumes:
  mysql_data:
  dbgate_data:

